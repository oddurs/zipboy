name: CI

on:
  push:
    branches: [main]
  pull_request:
  # By hand on any branch, which is how a deliberately failing branch proves the check can go red.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Pinned to the image whose Swift matches development; swift-format's
    # output changes between releases, so a drifting runner fails lint.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Restores the newest earlier build, so a run compiles only what changed since.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}-
      - run: swift --version
      - run: scripts/task check

  required:
    # The single status check branch protection requires.
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - run: echo "all checks passed"
