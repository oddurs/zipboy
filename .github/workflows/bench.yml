name: Benchmarks

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/bench-fixtures
          key: bench-fixtures-v1
      - name: Run benchmarks against budgets
        run: |
          mkdir -p build
          set -o pipefail
          scripts/bench | tee build/bench-results.txt
      - name: Keep benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results-${{ github.run_id }}
          path: build/bench-results.txt
